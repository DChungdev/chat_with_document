apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: docchat, component: api }
spec:
  replicas: 2 # stateless, nhân bản ngang (SAD 3.2)
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: docchat, component: api }
  template:
    metadata:
      labels: { app: docchat, component: api }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 60 # chờ SSE đang chạy kết thúc
      containers:
        - name: api
          image: docchat-api
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: docchat-config }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: docchat-secrets, key: DATABASE_URL } }
            - name: S3_ENDPOINT_URL
              valueFrom: { secretKeyRef: { name: docchat-secrets, key: S3_ENDPOINT_URL, optional: true } }
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: docchat-secrets, key: S3_ACCESS_KEY } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: docchat-secrets, key: S3_SECRET_KEY } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: docchat-secrets, key: JWT_SECRET } }
            - name: TELEMETRY_SALT
              valueFrom: { secretKeyRef: { name: docchat-secrets, key: TELEMETRY_SALT } }
            - name: LLM_API_KEY
              valueFrom: { secretKeyRef: { name: docchat-secrets, key: LLM_API_KEY, optional: true } }
            - name: EMBEDDING_API_KEY
              valueFrom: { secretKeyRef: { name: docchat-secrets, key: EMBEDDING_API_KEY, optional: true } }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: { app: docchat, component: api }
spec:
  selector: { app: docchat, component: api }
  ports:
    - { name: http, port: 8000, targetPort: http }
