apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: { app: docchat, component: web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: docchat, component: web }
  template:
    metadata:
      labels: { app: docchat, component: web }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: docchat-web
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
          livenessProbe:
            httpGet: { path: /health, port: http }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels: { app: docchat, component: web }
spec:
  selector: { app: docchat, component: web }
  ports:
    - { name: http, port: 8080, targetPort: http }
