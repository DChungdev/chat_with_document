server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Không lộ phiên bản; header bảo mật cơ bản (CSP chi tiết được siết ở task rà soát bảo mật G8)
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location /health {
    access_log off;
    return 200 "ok";
  }

  # Chuyển /api sang dịch vụ api. SSE cần tắt đệm để token đến ngay.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  # Tài nguyên có băm tên: cache dài; index.html: không cache
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store";
  }
}
