server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Không lộ phiên bản; header bảo mật (G8) nằm trong web.security.conf
  server_tokens off;
  include /etc/nginx/web.security.conf;

  location /health {
    access_log off;
    return 200 "ok";
  }

  # Chuyển /api sang dịch vụ api. SSE cần tắt đệm để token đến ngay.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  # Tài nguyên có băm tên: cache dài; index.html: không cache
  location /assets/ {
    include /etc/nginx/web.security.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/web.security.conf;
    add_header Cache-Control "no-store";
  }
}
