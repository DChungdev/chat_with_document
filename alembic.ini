[alembic]
script_location = db/migrations
# The DB URL comes from MIGRATOR_DATABASE_URL (see db/migrations/env.py); never put it here.
# Keep this file ASCII-only: Alembic reads it with the locale encoding (cp1252 on Windows).
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
