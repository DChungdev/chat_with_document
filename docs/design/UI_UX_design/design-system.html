<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design system — Chat với tài liệu</title>
<style>
/* ==========================================================================
   Design system — "Chat với tài liệu"
   Nguồn: UIUX_Blueprint_SDD.md §3.2 (tokens [Đề xuất], OQ-002 chưa chốt brand)
   Component chỉ tham chiếu token, không dùng giá trị thô (DD / 3.3).
   ========================================================================== */

:root {
  /* Màu */
  --color-primary: #1f5fbf;
  --color-primary-hover: #194e9d;
  --color-primary-soft: #e8f0fc;
  --color-success: #1b7f3b;
  --color-success-soft: #e6f4ea;
  --color-warning: #8a5a00;
  --color-warning-soft: #fff4de;
  --color-danger: #b3261e;
  --color-danger-soft: #fce8e6;
  --color-info: #1f5fbf;
  --color-info-soft: #e8f0fc;

  --surface-bg: #f7f8fa;
  --surface-panel: #ffffff;
  --surface-ai: #f0f4fa;
  --surface-overlay: rgba(16, 24, 40, 0.5);

  --text: #1d2433;
  --text-muted: #566075; /* 6.4:1 trên trắng */
  --border: #d5dbe5;
  --border-strong: #8d97aa;

  /* Chữ */
  --font-family: "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --text-sm: 0.875rem; /* 14 */
  --text-base: 1rem; /* 16 */
  --text-lg: 1.125rem; /* 18 */
  --text-xl: 1.5rem; /* 24 */

  /* Khoảng cách — lưới 4px */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;

  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-pill: 999px;
  --shadow-1: 0 1px 2px rgba(16, 24, 40, 0.08), 0 1px 3px rgba(16, 24, 40, 0.06);
  --shadow-2: 0 8px 24px rgba(16, 24, 40, 0.16);

  --focus-ring: 0 0 0 2px #fff, 0 0 0 4px var(--color-primary);
  --motion-fast: 120ms;
  --motion-base: 200ms;

  --header-h: 56px;
  --touch: 44px;
}

*,
*::before,
*::after { box-sizing: border-box; }

html { font-size: 100%; }

body {
  margin: 0;
  font-family: var(--font-family);
  font-size: var(--text-base);
  line-height: 1.5;
  color: var(--text);
  background: var(--surface-bg);
}

h1, h2, h3, h4 { line-height: 1.3; margin: 0 0 var(--space-3); }
h1 { font-size: var(--text-xl); }
h2 { font-size: var(--text-lg); }
h3 { font-size: var(--text-base); }
p { margin: 0 0 var(--space-3); }
a { color: var(--color-primary); }
code, kbd { font-family: ui-monospace, Consolas, monospace; font-size: 0.9em; background: var(--surface-bg); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border); }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: 6px; }

.icon { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Button ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  min-height: var(--touch); padding: 0 var(--space-4);
  font: inherit; font-weight: 600; font-size: var(--text-sm);
  color: var(--text); background: var(--surface-panel);
  border: 1px solid var(--border-strong); border-radius: var(--radius-md);
  cursor: pointer; text-decoration: none;
  transition: background var(--motion-fast), border-color var(--motion-fast), transform var(--motion-fast);
}
.btn:hover { background: var(--surface-bg); }
.btn:active { transform: translateY(1px); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }
.btn-primary:hover { background: var(--color-primary-hover); }
.btn-danger { background: var(--color-danger); border-color: var(--color-danger); color: #fff; }
.btn-danger:hover { background: #8f1d17; }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-ghost:hover { background: var(--primary-soft, var(--color-primary-soft)); }
.btn-sm { min-height: 32px; padding: 0 var(--space-3); }
.btn-icon { width: var(--touch); padding: 0; }
.btn-icon.btn-sm { width: 32px; }

/* ---------- Badge / status ---------- */
.badge {
  display: inline-flex; align-items: center; gap: var(--space-1);
  padding: 2px var(--space-2); border-radius: var(--radius-pill);
  font-size: 0.8125rem; font-weight: 600; line-height: 1.4;
}
.badge .icon { width: 14px; height: 14px; }
.badge-info { background: var(--color-info-soft); color: var(--color-info); }
.badge-success { background: var(--color-success-soft); color: var(--color-success); }
.badge-warning { background: var(--color-warning-soft); color: var(--color-warning); }
.badge-danger { background: var(--color-danger-soft); color: var(--color-danger); }
.badge-neutral { background: var(--surface-bg); color: var(--text-muted); border: 1px solid var(--border); }

/* ---------- Progress ---------- */
.progress { height: 6px; background: var(--border); border-radius: var(--radius-pill); overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--color-primary); transition: width var(--motion-base); }
.progress.indeterminate > span { width: 40% !important; animation: slide 1.2s ease-in-out infinite; background: var(--color-warning); }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }

/* ---------- Skeleton / spinner ---------- */
.skeleton { background: linear-gradient(90deg, var(--border) 25%, #e8ecf2 50%, var(--border) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px; height: 14px; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--color-primary); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Form ---------- */
.field-label { display: block; font-weight: 600; font-size: var(--text-sm); margin-bottom: var(--space-1); }
.checkbox { width: 20px; height: 20px; accent-color: var(--color-primary); cursor: pointer; flex: none; }
.checkbox[disabled] { cursor: not-allowed; }
.checkbox-hit { display: inline-flex; align-items: center; justify-content: center; min-width: 32px; min-height: 32px; }

/* ---------- Notice / alert ---------- */
.alert {
  display: flex; gap: var(--space-3); align-items: flex-start;
  padding: var(--space-3) var(--space-4); border-radius: var(--radius-md);
  border: 1px solid; font-size: var(--text-sm);
}
.alert-info { background: var(--color-info-soft); border-color: #b9d0f2; color: #153f7d; }
.alert-warning { background: var(--color-warning-soft); border-color: #ecd09a; color: #5e3d00; }
.alert-danger { background: var(--color-danger-soft); border-color: #f0b8b3; color: #7d1a14; }
.alert-success { background: var(--color-success-soft); border-color: #a9d7b6; color: #11582a; }
.alert .grow { flex: 1; }

/* ---------- Toast ---------- */
.toasts { position: fixed; right: var(--space-4); bottom: var(--space-4); z-index: 60; display: flex; flex-direction: column; gap: var(--space-2); width: min(380px, calc(100vw - 32px)); }
.toast { box-shadow: var(--shadow-2); background: var(--surface-panel); animation: pop var(--motion-base) ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- Dialog ---------- */
dialog { border: none; border-radius: var(--radius-lg); padding: 0; box-shadow: var(--shadow-2); width: min(520px, calc(100vw - 32px)); color: var(--text); background: var(--surface-panel); }
dialog::backdrop { background: var(--surface-overlay); }
.dialog-body { padding: var(--space-5); }
.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); padding: var(--space-3) var(--space-5) var(--space-5); flex-wrap: wrap; }
.dialog-title { display: flex; align-items: center; gap: var(--space-2); }

/* ---------- Layout: prototype shell ---------- */
.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
.app-header {
  height: var(--header-h); flex: none; display: flex; align-items: center; gap: var(--space-3);
  padding: 0 var(--space-4); background: var(--surface-panel); border-bottom: 1px solid var(--border);
}
.app-header .title { font-weight: 700; font-size: var(--text-lg); margin: 0; }
.app-header .spacer { flex: 1; }
.app-header .menu-btn { display: none; }
.user-chip { display: inline-flex; align-items: center; gap: var(--space-2); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--color-primary); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: var(--text-sm); }

.global-banner { flex: none; }
.global-banner .alert { border-radius: 0; border-width: 0 0 1px; }

.workspace { flex: 1; min-height: 0; display: grid; grid-template-columns: 320px minmax(0, 1fr) 0; transition: grid-template-columns var(--motion-base); }
.workspace.source-open { grid-template-columns: 320px minmax(0, 1fr) 360px; }

.panel { background: var(--surface-panel); min-height: 0; display: flex; flex-direction: column; }
.panel-head { padding: var(--space-4); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: var(--space-3); }
.panel-head h2 { margin: 0; font-size: var(--text-sm); letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); }
.panel-docs { border-right: 1px solid var(--border); }
.panel-source { border-left: 1px solid var(--border); overflow: hidden; visibility: hidden; }
.workspace.source-open .panel-source { visibility: visible; }
.panel-scroll { overflow-y: auto; flex: 1; min-height: 0; }

/* ---------- Document list ---------- */
.doc-limit { font-size: var(--text-sm); color: var(--text-muted); margin: 0; }
.dropzone { border: 2px dashed var(--border-strong); border-radius: var(--radius-md); padding: var(--space-3); text-align: center; font-size: var(--text-sm); color: var(--text-muted); }
.dropzone.drag { border-color: var(--color-primary); background: var(--color-primary-soft); color: var(--color-primary); }
.doc-list { list-style: none; margin: 0; padding: var(--space-2); }
.doc-item { display: flex; gap: var(--space-2); padding: var(--space-3); border-radius: var(--radius-md); border: 1px solid transparent; }
.doc-item:hover { background: var(--surface-bg); }
.doc-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-1); }
.doc-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-meta { font-size: var(--text-sm); color: var(--text-muted); }
.doc-actions { display: flex; gap: var(--space-1); flex-wrap: wrap; margin-top: var(--space-1); }
.doc-error { font-size: var(--text-sm); color: var(--color-danger); }

/* ---------- Empty state ---------- */
.empty { text-align: center; padding: var(--space-6) var(--space-4); color: var(--text-muted); }
.empty .empty-art { width: 56px; height: 56px; margin: 0 auto var(--space-3); border-radius: 50%; background: var(--color-primary-soft); color: var(--color-primary); display: grid; place-items: center; }
.empty .empty-art .icon { width: 28px; height: 28px; }
.empty h3 { color: var(--text); }

/* ---------- Chat ---------- */
.panel-chat { background: var(--surface-bg); position: relative; }
.ai-banner { flex: none; margin: var(--space-3) var(--space-4) 0; }
.messages { flex: 1; min-height: 0; overflow-y: auto; padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); scroll-behavior: smooth; }
.msg { display: flex; flex-direction: column; max-width: min(760px, 100%); gap: var(--space-2); }
.msg-user { align-self: flex-end; align-items: flex-end; }
.msg-ai { align-self: flex-start; }
.bubble { padding: var(--space-3) var(--space-4); border-radius: var(--radius-lg); box-shadow: var(--shadow-1); white-space: pre-wrap; overflow-wrap: anywhere; }
.msg-user .bubble { background: var(--color-primary); color: #fff; border-bottom-right-radius: 4px; }
.msg-ai .bubble { background: var(--surface-ai); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.msg-ai .bubble.not-grounded { background: var(--color-warning-soft); border-color: #ecd09a; }
.msg-head { display: flex; align-items: center; gap: var(--space-2); font-size: 0.8125rem; color: var(--text-muted); font-weight: 600; }
.cursor { display: inline-block; width: 8px; height: 1em; background: var(--color-primary); vertical-align: text-bottom; animation: blink 1s steps(2) infinite; margin-left: 2px; }
@keyframes blink { 50% { opacity: 0; } }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.chip {
  display: inline-flex; align-items: center; gap: var(--space-1); min-height: 32px; padding: 0 var(--space-3);
  background: var(--surface-panel); color: var(--color-primary); border: 1px solid var(--color-primary);
  border-radius: var(--radius-pill); font: inherit; font-size: var(--text-sm); font-weight: 600; cursor: pointer;
}
.chip:hover { background: var(--color-primary-soft); }
.chip[aria-expanded="true"] { background: var(--color-primary); color: #fff; }
.chip.invalid { color: var(--text-muted); border-color: var(--border-strong); text-decoration: line-through; }
.answer-actions { display: flex; align-items: center; gap: var(--space-1); flex-wrap: wrap; }
.answer-actions .btn[aria-pressed="true"] { background: var(--color-primary-soft); border-color: var(--color-primary); color: var(--color-primary); }
.msg-status { font-size: var(--text-sm); display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.msg-status.danger { color: var(--color-danger); }
.msg-status.warning { color: var(--color-warning); }
.scroll-down { position: absolute; right: var(--space-5); bottom: 150px; box-shadow: var(--shadow-2); z-index: 5; }

.suggestions { display: flex; flex-direction: column; gap: var(--space-2); align-items: center; margin-top: var(--space-4); }
.suggestion { text-align: left; max-width: 420px; width: 100%; }

.composer { flex: none; background: var(--surface-panel); border-top: 1px solid var(--border); padding: var(--space-3) var(--space-4) var(--space-4); }
.composer-row { display: flex; gap: var(--space-2); align-items: flex-end; }
.composer textarea {
  flex: 1; font: inherit; resize: none; min-height: var(--touch); max-height: 160px; padding: 10px var(--space-3);
  border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--surface-panel); color: var(--text);
}
.composer textarea:disabled { background: var(--surface-bg); cursor: not-allowed; }
.composer textarea:focus-visible { box-shadow: var(--focus-ring); }
.composer-meta { display: flex; justify-content: space-between; gap: var(--space-3); margin-top: var(--space-2); font-size: var(--text-sm); color: var(--text-muted); flex-wrap: wrap; }
.composer-meta .reason { color: var(--color-warning); font-weight: 600; }
.trial-bar { margin-top: var(--space-2); }

/* ---------- Source panel ---------- */
.source-body { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); overflow-y: auto; }
.source-quote { margin: 0; padding: var(--space-3) var(--space-4); background: var(--color-warning-soft); border-left: 4px solid var(--color-warning); border-radius: 0 var(--radius-md) var(--radius-md) 0; font-size: var(--text-base); }
.source-meta { display: flex; gap: var(--space-2); flex-wrap: wrap; }

/* ---------- Demo bar (ngoài sản phẩm — chỉ dùng cho prototype) ---------- */
.demo-bar { flex: none; background: #1d2433; color: #e9edf5; padding: var(--space-2) var(--space-4); font-size: var(--text-sm); display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; }
.demo-bar strong { margin-right: var(--space-2); }
.demo-bar .btn { background: #2c3650; color: #fff; border-color: #44506f; min-height: 32px; font-weight: 500; }
.demo-bar .btn:hover { background: #3a4668; }
.demo-bar .btn.active { background: #fff; color: #1d2433; }
.demo-bar select { min-height: 32px; border-radius: var(--radius-md); border: 1px solid #44506f; background: #2c3650; color: #fff; font: inherit; padding: 0 var(--space-2); }
.demo-bar label { display: inline-flex; gap: var(--space-2); align-items: center; }
.demo-bar a { color: #9fc2ff; }
.tel-log { flex-basis: 100%; max-height: 140px; overflow: auto; background: #0f1523; border-radius: var(--radius-md); padding: var(--space-2) var(--space-3); font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
.tel-log[hidden] { display: none; }
.tel-log div { white-space: pre-wrap; }
.tel-log .blocked { color: #ff9a92; }

/* ---------- Notice gate (SCR-01) ---------- */
.notice-list { padding-left: var(--space-5); margin: 0 0 var(--space-3); }
.notice-box { background: var(--surface-bg); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); margin-bottom: var(--space-4); font-size: var(--text-sm); }
.check-row { display: flex; gap: var(--space-3); align-items: flex-start; cursor: pointer; }
.tbd { background: var(--color-warning-soft); color: var(--color-warning); border-radius: 4px; padding: 0 4px; font-size: 0.8125rem; font-weight: 600; }

/* ---------- Docs pages (index, design system, report) ---------- */
.page { max-width: 1120px; margin: 0 auto; padding: var(--space-6) var(--space-4) var(--space-8); }
.page-header { display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: flex-end; justify-content: space-between; margin-bottom: var(--space-5); }
.page-header p { color: var(--text-muted); margin: 0; max-width: 62ch; }
.card { background: var(--surface-panel); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-5); box-shadow: var(--shadow-1); }
.grid { display: grid; gap: var(--space-4); }
.grid-3 { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.grid-2 { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
.grid-4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.section { margin-top: var(--space-7); }
.section > h2 { font-size: var(--text-xl); margin-bottom: var(--space-4); }
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface-panel); }
table { border-collapse: collapse; width: 100%; font-size: var(--text-sm); }
th, td { padding: var(--space-2) var(--space-3); text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
th { background: var(--surface-bg); font-weight: 700; white-space: nowrap; }
tr:last-child td { border-bottom: none; }
.swatch { height: 56px; border-radius: var(--radius-md); border: 1px solid var(--border); margin-bottom: var(--space-2); }
.scr-card { display: flex; flex-direction: column; gap: var(--space-2); text-decoration: none; color: inherit; }
.scr-card:hover { border-color: var(--color-primary); }
.scr-id { font-weight: 700; color: var(--color-primary); font-size: var(--text-sm); }
.muted { color: var(--text-muted); }
.kpi { font-size: 2rem; font-weight: 700; line-height: 1.1; }
.row { display: flex; gap: var(--space-3); flex-wrap: wrap; align-items: center; }

/* ---------- Responsive ---------- */
@media (max-width: 1279px) {
  .workspace { grid-template-columns: 280px minmax(0, 1fr) 0; }
  .workspace.source-open { grid-template-columns: 280px minmax(0, 1fr) 320px; }
}

/* < 1024px: danh sách tài liệu thành drawer, nguồn thành bottom sheet (DD-10) */
@media (max-width: 1023px) {
  .app-header .menu-btn { display: inline-flex; }
  .workspace, .workspace.source-open { grid-template-columns: minmax(0, 1fr); }
  .panel-docs {
    position: fixed; top: var(--header-h); bottom: 0; left: 0; width: min(340px, 90vw); z-index: 40;
    transform: translateX(-100%); transition: transform var(--motion-base); box-shadow: var(--shadow-2);
  }
  .panel-docs.open { transform: none; }
  .drawer-scrim { position: fixed; inset: var(--header-h) 0 0 0; background: var(--surface-overlay); z-index: 35; }
  .drawer-scrim[hidden] { display: none; }
  .panel-source {
    position: fixed; left: 0; right: 0; bottom: 0; max-height: 60vh; z-index: 45; border-left: 0; border-top: 1px solid var(--border);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0; box-shadow: var(--shadow-2); transform: translateY(100%); transition: transform var(--motion-base);
  }
  .workspace.source-open .panel-source { transform: none; }
  .scroll-down { bottom: 170px; }
}

@media (max-width: 599px) {
  .app-header .title { font-size: var(--text-base); }
  .hide-sm { display: none; }
  .user-chip .name { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
  .cursor { animation: none; }
}

</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 21h20zM12 10v5M12 18h.01"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></symbol>
