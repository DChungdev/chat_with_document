repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^docs/
      - id: end-of-file-fixer
        exclude: ^(docs/|apps/web/pnpm-lock.yaml)
      - id: check-yaml
        exclude: ^deploy/k8s/
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  # Dùng công cụ đã cài trong .venv (pip install -e ".[dev]") để phiên bản khớp với CI.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: system
        types: [python]
      - id: black
        name: black
        entry: black
        language: system
        types: [python]
      - id: web-prettier
        name: prettier (apps/web)
        entry: pnpm --dir apps/web exec prettier --write --ignore-unknown
        language: system
        files: ^apps/web/
        exclude: ^apps/web/pnpm-lock.yaml
      - id: web-eslint
        name: eslint (apps/web)
        entry: pnpm --dir apps/web exec eslint
        language: system
        files: ^apps/web/.*\.(ts|tsx|js)$
        pass_filenames: false
